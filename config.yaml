transformations:
  copies: 3                 # Cuántas variantes generar por cada imagen original
  pipeline:                 # Se ejecuta de arriba hacia abajo, en este orden
    - type: resize
      width: 800
      height: 800
      mode: stretch         # 'stretch' (deforma), 'fit' (mantiene aspect ratio), 'crop' (recorta al centro)
    - type: rotate
      angle: 45
      mode: crop            # 'fill' (expande el canvas), 'crop' (recorta para mantener el tamaño)
    # - type: grayscale     # Para desactivar un paso, borralo o comentalo
    - type: brightness
      min_factor: 0.5       # 1.0 es original, <1 oscurece, >1 ilumina
      max_factor: 1.5