[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "image-processor"
version = "0.1.0"
description = "Pipeline y biblioteca de procesamiento y aumento de imágenes por lotes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
image-processor = "main:main"

[tool.setuptools]
packages = ["image_processor"]
py-modules = ["processor", "main"]
